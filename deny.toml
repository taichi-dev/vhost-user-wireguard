[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Used by the ICU crates pulled in via dhcproto -> hickory-proto -> idna.
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.16+ removed per-kind severity ("warn"/"deny") strings; vulnerabilities
# and yanked crates are always denied. `unmaintained` is now a scope filter.
unmaintained = "workspace"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
